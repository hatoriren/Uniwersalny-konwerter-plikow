[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uniwersalny-konwerter-plikow"
version = "1.0.0"
description = "Desktopowy konwerter plików CSV, JSON, TXT, DOCX, ODT i PDF"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Anastasiia Nerestenko" }]
dependencies = [
    "python-docx>=1.1,<2.0",
    "odfpy>=1.4,<2.0",
    "customtkinter>=6.0,<7.0",
    "pillow>=10,<12",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9.0"]

[project.scripts]
konwerter = "converter.cli:main"

[tool.setuptools.packages.find]
include = ["converter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
